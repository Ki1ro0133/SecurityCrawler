<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 查看器</title>
    <base href="/papers/">
    <style>
      :root {
        --bg: #0f172a;
        --panel-bg: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
        --accent: #3b82f6;
        --grad-start: #0ea5e9;
        --grad-end: #3b82f6;
        --code-bg: #0b1220;
      }
      :root[data-theme="light"] {
        --bg: #f8fafc;
        --panel-bg: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --accent: #2563eb;
        --grad-start: #93c5fd;
        --grad-end: #60a5fa;
        --code-bg: #f3f4f6;
      }
      body { font-family: -apple-system, system-ui, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
      .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: linear-gradient(90deg, var(--grad-start), var(--grad-end)); color: #fff; }
      .brand { font-size: 18px; font-weight: 600; }
      .container { max-width: 960px; margin: 0 auto; padding: 20px; }
      .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
      .layout { display: grid; grid-template-columns: minmax(0, 700px) 220px; gap: 16px; }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .toc-panel { display: none; }
      }
      .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-bg); color: var(--text); cursor: pointer; }
      .btn-primary { background: var(--accent); color: #fff; border-color: #2563eb; }
      .md-viewer { line-height: 1.8; word-wrap: break-word; overflow-wrap: anywhere; }
      .md-viewer h1, .md-viewer h2, .md-viewer h3 { margin-top: 16px; }
      .md-viewer pre { background: var(--code-bg); padding: 10px; overflow: auto; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
      .md-viewer code { background: var(--code-bg); padding: 2px 6px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
      .md-viewer a { color: var(--accent); }
      /* 表格基础样式（GFM） */
      .md-viewer table { width: 100%; border-collapse: collapse; margin: 12px 0; }
      .md-viewer th, .md-viewer td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
      .md-viewer thead th { background: rgba(59,130,246,0.12); }
      .md-viewer tbody tr:nth-child(odd) { background: rgba(148,163,184,0.06); }
      .md-viewer img { max-width: 100%; height: auto; display: block; margin: 8px auto; border: 2px dashed var(--accent); border-radius: 8px; }
      .title { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
      /* 目录样式 */
      .toc-panel { position: sticky; top: 16px; height: fit-content; }
      .toc-title { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
      .toc-list { list-style: none; padding: 0; margin: 0; max-height: 540px; overflow: auto; }
      .toc-list li { margin: 4px 0; }
      .toc-list a { color: var(--text); text-decoration: none; font-size: 13px; }
      .toc-list a:hover { text-decoration: underline; color: var(--accent); }
      .toc-item.level-h1 a { font-weight: 600; }
      .toc-item.level-h2 a { padding-left: 8px; }
      .toc-item.level-h3 a { padding-left: 16px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Markdown 查看器</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="backBtn" class="btn">返回首页</button>
        <button id="themeToggle" class="btn">切换主题</button>
      </div>
    </div>
    <div class="container">
      <div class="layout">
        <div class="panel">
          <div id="viewerTitle" class="title">正在加载...</div>
          <div id="viewerContent" class="md-viewer"></div>
        </div>
        <aside class="panel toc-panel">
          <div class="toc-title">目录</div>
          <ul id="tocList" class="toc-list"></ul>
        </aside>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/viewer.js"></script>
  </body>
  </html>
